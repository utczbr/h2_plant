  # =================================================================================
  # WATER RECIRCULATION LOOP
  # =================================================================================

  - id: "SOEC_Drain_Mixer"
    type: "DrainRecorderMixer"
    params:
      source_ids: ["SOEC_DRAIN_PUMP_1", "SOEC_DRAIN_PUMP_2"]
    connections:
      - source_port: "outlet"
        target_name: "SOEC_Drain_Pump"
        target_port: "water_in"
